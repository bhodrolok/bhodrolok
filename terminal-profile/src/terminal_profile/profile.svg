<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 600 306"
    width="600"
    height="306"
>
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">

            <style>
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }

                .terminal-window {
                    width: 100%;
                    height: 100%;
                    background: #42092b;
                    color: #e5f9e3;
                    font-family: "Source Code Pro",
                                 "Bitstream Vera Sans Mono",
                                 monospace;
                }

                .titlebar,
                .menubar {
                    background: #4a4842;
                    display: flex;
                    align-items: center;
                }

                .titlebar {
                    height: 40px;
                    justify-content: center;
                    position: relative;
                }

                .title {
                    color: #e8ead4;
                    font-size: 16px;
                }

                .window-controls {
                    position: absolute;
                    right: 12px;
                    display: flex;
                    gap: 10px;
                }

                .control {
                    color: #e8ead4;
                    font-family: sans-serif;
                }

                .menubar {
                    height: 30px;
                    padding-left: 12px;
                    gap: 18px;
                    color: #e8ead4;
                    font-family: sans-serif;
                    font-size: 13px;
                }

                hr {
                    border: 0;
                    border-top: 2px solid #3e3d39;
                }

                .terminal {
                    padding: 8px 12px;
                    font-size: 14px;
                    line-height: 20px;
                }

                .command-line {
                    white-space: nowrap;
                }

                .prompt {
                    color: #79d634;
                }

                .path {
                    color: #445caa;
                }

                .symbol {
                    color: #f5fdfe;
                }

                .command {
                    color: #e5f9e3;
                }

                .output {
                    color: antiquewhite;
                }

                .output-line {
                    white-space: pre-wrap;
                }
            </style>

            <div class="terminal-window">

                <div class="titlebar">
                    <div class="title">
                        rcxd@buntu-box:~
                    </div>

                    <div class="window-controls">
                        <span class="control">−</span>
                        <span class="control">□</span>
                        <span class="control">×</span>
                    </div>
                </div>

                <hr />

                <div class="menubar">
                    <span>File</span>
                    <span>Edit</span>
                    <span>View</span>
                    <span>Search</span>
                    <span>Terminal</span>
                    <span>Help</span>
                </div>

                <div class="terminal">

                    

                        <div class="command-line">
                            <span class="prompt">
                                rcxd@buntu-box:
                            </span><span class="path">~</span><span class="symbol">$</span>
                            <span class="command"> whoami</span>
                        </div>

                        
                            <div class="output output-line">Ranadip Chatterjee</div>
                        

                    

                        <div class="command-line">
                            <span class="prompt">
                                rcxd@buntu-box:
                            </span><span class="path">~</span><span class="symbol">$</span>
                            <span class="command"> whereis</span>
                        </div>

                        
                            <div class="output output-line">Kolkata, India</div>
                        

                    

                        <div class="command-line">
                            <span class="prompt">
                                rcxd@buntu-box:
                            </span><span class="path">~</span><span class="symbol">$</span>
                            <span class="command"> about -e</span>
                        </div>

                        
                            <div class="output output-line">BSc. Computer Science</div>
                        
                            <div class="output output-line">University of Calgary</div>
                        

                    

                        <div class="command-line">
                            <span class="prompt">
                                rcxd@buntu-box:
                            </span><span class="path">~</span><span class="symbol">$</span>
                            <span class="command"> status --current</span>
                        </div>

                        
                            <div class="output output-line">Looking for new opportunities</div>
                        

                    

                        <div class="command-line">
                            <span class="prompt">
                                rcxd@buntu-box:
                            </span><span class="path">~</span><span class="symbol">$</span>
                            <span class="command"> interests</span>
                        </div>

                        
                            <div class="output output-line">Web Dev, Distributed Systems, DevOps, Cloud, Generative AI</div>
                        

                    

                </div>

            </div>
        </div>
    </foreignObject>
</svg>